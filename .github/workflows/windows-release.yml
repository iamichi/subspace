# Builds the Windows archive of a Subspace desktop release, signs
# subspace.exe with Azure Artifact Signing and attaches the archive and its
# .sha256 file to the release. See "Sign Windows releases" in
# subspace-desktop/docs/installation.md.
#
# Every job runs on the Subspace self-hosted ARC scale sets in the platform's
# Kubernetes cluster (runner group `subspace-release`), never on GitHub-hosted
# runners:
#
# - build: `subspace-windows`, a Windows Server 2022 runner on a node pool
#   that scales from zero to one. A GPUI release build for Windows must run on
#   Windows, because the renderer compiles its shaders with the Windows SDK's
#   fxc.exe in a build script. The job holds no secrets and no OIDC
#   permission.
# - sign: `subspace-signing`, a Linux runner in the trusted deployment subnet,
#   which reaches the platform Key Vault through its private endpoint. The
#   `windows-signing` environment holds the Azure identity and the vault name
#   as secrets. The job signs in with GitHub OIDC and runs `make sign-windows`
#   (jsign), which reads the signing account and certificate profile from Key
#   Vault. The signing key never leaves Artifact Signing.
# - publish: back on `subspace-windows`, Windows' own verifier checks the
#   signature, then the archive is attached.
#
# The release workflow starts it on main when it creates an app release, so
# the archive is on the draft before `make release-macos` publishes it. The
# runner group admits only this file on main. To build an older release, or
# to try the build or the signing without attaching anything:
#   gh workflow run windows-release.yml --ref main -f tag=subspace-desktop-v0.9.0 -f mode=sign-only
name: windows-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, such as subspace-desktop-v0.10.0
        required: true
      mode:
        description: publish attaches the signed archive; sign-only and build-only attach nothing
        type: choice
        options: [publish, sign-only, build-only]
        default: publish

permissions: {}

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TARGET: x86_64-pc-windows-msvc
  # https://github.com/ebourg/jsign/releases; the digest GitHub lists for the JAR.
  JSIGN_VERSION: "7.6"
  JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: subspace-release
      labels: subspace-windows
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - name: Resolve the release
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^subspace-desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "not a stable Subspace desktop release tag: $TAG" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#subspace-desktop-v}"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Use the Rust toolchain mise.toml names
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' subspace-desktop/mise.toml)"
          test -n "$version"
          # The runner image carries the current toolchain; an older tag may name another.
          rustup toolchain install "$version" --profile minimal --target "$TARGET"
          rustup default "$version"
          rustc --version
      - name: Build the Windows archive
        id: package
        working-directory: subspace-desktop
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/package-release.sh "$TARGET" "$VERSION"
          archive="subspace-$VERSION-$TARGET.zip"
          test -s "dist/$archive"
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned
          path: subspace-desktop/dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: inputs.mode != 'build-only'
    runs-on:
      group: subspace-release
      labels: subspace-signing
    timeout-minutes: 20
    environment: windows-signing
    permissions:
      contents: read
      id-token: write # Sign in to Azure as the signing identity.
    steps:
      # The signing tools come from main; the build job built the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-unsigned
          path: subspace-desktop/dist
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install jsign
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/jsign-$JSIGN_VERSION.jar"
          curl --fail --silent --show-error --location --retry 3 --output "$jar" \
            "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  $jar" | sha256sum --check --strict -
          echo "SUBSPACE_JSIGN_JAR=$jar" >>"$GITHUB_ENV"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign subspace.exe in the archive
        working-directory: subspace-desktop
        env:
          SUBSPACE_SIGNING_KEY_VAULT: ${{ secrets.SUBSPACE_SIGNING_KEY_VAULT }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: make sign-windows FILES="dist/$ARCHIVE"
      - name: Sign out of Azure
        if: always()
        run: az logout || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signed
          path: |
            subspace-desktop/dist/${{ needs.build.outputs.archive }}
            subspace-desktop/dist/${{ needs.build.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [build, sign]
    runs-on:
      group: subspace-release
      labels: subspace-windows
    timeout-minutes: 15
    permissions:
      contents: write # Attach the archive to the release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed
          path: dist
      - name: Verify the checksum and the Authenticode signature
        shell: powershell
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist
          $expected = (Get-Content "$env:ARCHIVE.sha256" -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "checksum mismatch: $expected != $actual" }
          Expand-Archive $env:ARCHIVE -DestinationPath extracted
          $signature = Get-AuthenticodeSignature extracted/subspace.exe
          if ($signature.Status -ne 'Valid') {
            throw "subspace.exe signature is $($signature.Status): $($signature.StatusMessage)"
          }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'subspace.exe has no timestamp' }
          "Signed subspace.exe as $($signature.SignerCertificate.Subject)." >> $env:GITHUB_STEP_SUMMARY
      - name: Attach the archive to the release
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $ARCHIVE to $TAG." >>"$GITHUB_STEP_SUMMARY"
